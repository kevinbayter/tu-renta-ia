name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma exige la variable para leer su configuración, aunque `generate` y
      # el build no lleguen a conectarse. Es un valor de relleno, no una base real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generar cliente Prisma
        run: pnpm --filter @turenta/adaptadores db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (golden tests bloqueantes)
        run: pnpm test
      - name: Instalar Chromium
        run: pnpm --filter @turenta/adaptadores exec playwright install --with-deps chromium
      - name: Tests de navegador (MUISCA falso, bloqueantes)
        run: |
          pnpm --filter @turenta/adaptadores test:navegador
          pnpm --filter @turenta/worker-dian test:navegador
      - name: Build
        run: pnpm build
