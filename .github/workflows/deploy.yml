# Despliegue MANUAL: se lanza desde Actions → "Deploy to DigitalOcean" → Run
# workflow. Antes corría en cada push a main; se quitó el 2026-09-21 porque un
# push no debe poner en producción, por sí solo, un robot que firma y presenta
# declaraciones ante la DIAN. Una sola corrida redespliega web Y worker.
name: Deploy to DigitalOcean

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@"$HOST" '
            set -e
            cd /root/turenta
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env -f docker-compose.do.yml up -d --build
            docker image prune -f
          '
