# Push-to-deploy: on every push to main, rebuild and restart the stack on the
# DigitalOcean droplet over SSH. Replaces the old Dokploy webhook; here a single
# run redeploys web AND the DIAN worker (no more manual worker step).
name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@"$HOST" '
            set -e
            cd /root/turenta
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env -f docker-compose.do.yml up -d --build
            docker image prune -f
          '
