<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Flujo: Documentos, IA extrae, Motor fiscal calcula, Formulario 210">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#12102a"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1278" height="298" rx="19" fill="none" stroke="#2a3566" stroke-width="1.5" opacity="0.5"/>

  <!-- connecting wire -->
  <line x1="210" y1="150" x2="1070" y2="150" stroke="#22305a" stroke-width="3"/>
  <line x1="210" y1="150" x2="1070" y2="150" stroke="url(#wire)" stroke-width="3" stroke-dasharray="10 850" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="860;0" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- travelling packet -->
  <circle r="7" fill="#2dd4bf" filter="url(#g2)">
    <animateMotion path="M210,150 L1070,150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#2dd4bf;#818cf8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node template: circle + icon + label + sublabel -->
  <!-- 1 Documentos -->
  <g transform="translate(140 150)">
    <circle r="46" fill="#111a33" stroke="#2dd4bf" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0">
      <animate attributeName="r" values="46;62" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#a7f3d0" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" transform="translate(-16 -18)">
      <rect x="4" y="2" width="22" height="30" rx="2.5" fill="#0b1020"/>
      <line x1="9" y1="10" x2="21" y2="10"/><line x1="9" y1="16" x2="21" y2="16"/><line x1="9" y1="22" x2="17" y2="22"/>
    </g>
    <text x="0" y="76" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">Documentos</text>
    <text x="0" y="98" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8595bd">exógena + certificados</text>
  </g>

  <!-- 2 IA extrae -->
  <g transform="translate(500 150)">
    <circle r="46" fill="#111a33" stroke="#60a5fa" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0">
      <animate attributeName="r" values="46;62" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0 -2)" stroke="#bfdbfe" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M-18 0 Q0 -15 18 0 Q0 15 -18 0Z"/><circle cx="0" cy="0" r="6" fill="#60a5fa" stroke="none"/>
    </g>
    <text x="0" y="76" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">IA extrae</text>
    <text x="0" y="98" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8595bd">lee 2× · el usuario confirma</text>
  </g>

  <!-- 3 Motor fiscal -->
  <g transform="translate(780 150)">
    <circle r="46" fill="#111a33" stroke="#818cf8" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#818cf8" stroke-width="2" opacity="0">
      <animate attributeName="r" values="46;62" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0 0)" fill="none" stroke="#c7d2fe" stroke-width="2.2">
      <circle r="11"/><g stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="-14"/><line x1="0" y1="14" x2="0" y2="18"/>
      <line x1="-18" y1="0" x2="-14" y2="0"/><line x1="14" y1="0" x2="18" y2="0"/>
      <line x1="-12.7" y1="-12.7" x2="-9.9" y2="-9.9"/><line x1="9.9" y1="9.9" x2="12.7" y2="12.7"/>
      <line x1="12.7" y1="-12.7" x2="9.9" y2="-9.9"/><line x1="-9.9" y1="9.9" x2="-12.7" y2="12.7"/></g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="76" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">Motor fiscal</text>
    <text x="0" y="98" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8595bd">determinista · cita la norma</text>
  </g>

  <!-- 4 Formulario 210 -->
  <g transform="translate(1090 150)">
    <circle r="46" fill="#111a33" stroke="#34d399" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
      <animate attributeName="r" values="46;62" dur="3s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(-15 -18)" stroke="#a7f3d0" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="24" height="32" rx="2.5" fill="#0b1020"/>
      <path d="M6 16 l5 5 l9 -11"><animate attributeName="stroke-dasharray" values="0 30;30 0" dur="3s" begin="2.3s" repeatCount="indefinite"/></path>
    </g>
    <text x="0" y="76" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">Formulario 210</text>
    <text x="0" y="98" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8595bd">borrador listo para la DIAN</text>
  </g>
</svg>
