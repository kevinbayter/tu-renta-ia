<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="TuRenta AI — La IA lee, el codigo calcula">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0d1224"/>
      <stop offset="1" stop-color="#141032"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#243056" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#2a3566" stroke-width="1.5" opacity="0.6"/>

  <!-- hexagon nod to the hexagonal architecture -->
  <g transform="translate(1050 170)" opacity="0.5">
    <polygon points="0,-96 83,-48 83,48 0,96 -83,48 -83,-48" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <circle r="120" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="60;150" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- badge -->
  <g transform="translate(72 66)">
    <rect width="196" height="30" rx="15" fill="#10182f" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>
    <circle cx="19" cy="15" r="4" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="34" y="20" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#a7f3d0" letter-spacing="0.5">Colombia · Renta personas naturales</text>
  </g>

  <!-- title -->
  <text x="70" y="176" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#title)">TuRenta</tspan><tspan fill="#2dd4bf" filter="url(#glow)"> AI</tspan>
  </text>

  <!-- tagline with blinking cursor -->
  <text x="74" y="232" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" fill="#cbd5e1">
    La IA lee<tspan fill="#64748b"> · </tspan><tspan fill="#818cf8">el código calcula</tspan>
    <tspan fill="#2dd4bf" font-weight="700">▍<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- tech chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#93a4c9">
    <g transform="translate(74 270)">
      <rect width="216" height="30" rx="8" fill="#131a30" stroke="#273358"/>
      <text x="14" y="20">Motor fiscal 100% determinista</text>
    </g>
    <g transform="translate(300 270)">
      <rect width="118" height="30" rx="8" fill="#131a30" stroke="#273358"/>
      <text x="14" y="20">Next.js · TS</text>
    </g>
    <g transform="translate(428 270)">
      <rect width="150" height="30" rx="8" fill="#131a30" stroke="#273358"/>
      <text x="14" y="20">Arquitectura hexagonal</text>
    </g>
  </g>
</svg>
