services:
  postgres:
    image: postgres:16-alpine
    container_name: turenta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: turenta
      POSTGRES_PASSWORD: turenta_dev
      POSTGRES_DB: turenta_dev
    ports:
      - '5433:5432'
    volumes:
      - turenta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U turenta -d turenta_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mismo worker que producción (Dockerfile.worker-dian). Solo arranca con
  # `--profile dian`; sus secretos van en .env.dian.local, fuera del .env.local de la web.
  worker-dian:
    profiles: [dian]
    build:
      context: .
      dockerfile: Dockerfile.worker-dian
    container_name: turenta-worker-dian
    restart: unless-stopped
    env_file: .env.dian.local
    environment:
      WORKER_DIAN_CONCURRENCIA: '2'
    ports:
      - '127.0.0.1:8787:8080'

volumes:
  turenta_pgdata:
