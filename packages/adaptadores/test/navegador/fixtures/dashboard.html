<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DIAN — Dashboard (fixture de prueba)</title>
    <style>
      /* The side menu only opens on real pointer :hover. A synthetic
         element.click() does not trigger :hover, which is exactly the finding in
         research §2.1.3. If someone "simplifies" the adapter's hover into a
         click, these tests fail. */
      #divMenuTd .arbol {
        display: none;
      }
      #divMenuTd:hover .arbol {
        display: block;
      }
      #divMenuTd {
        width: 40px;
        height: 600px;
        background: #ccc;
      }
      /* Exógena controls are in the DOM from the very first paint, sized 0x0,
         just like the live portal. Only the modal reveals them (research
         §2.1.2), so clicking early hits something invisible. */
      .oculto {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Test dashboard - NOT the DIAN</h1>

    <!-- Collapsed side menu. -->
    <table>
      <tr>
        <td id="divMenuTd">
          MENÚ
          <div class="arbol">
            <a href="/WebDilIngresoFormRenta210/">Diligenciar / Presentar</a>
            <a href="#">Consultar documento Diligenciado</a>
          </div>
        </td>
        <td>
          <!-- The JSF prefix here is "vistaPrueba:frmPrueba", different from
               production, proving the [id$=...] suffix anchoring works and that
               nobody hardcoded the real prefix. -->
          <a href="#" id="enlaceExogena">Consultar información Exógena Información Reportada por terceros</a>

          <!-- Faithful to the live portal: the electronic invoices panel sits on
               the same form with sibling controls named btnBuscarFE / anioSelFE.
               They must NOT collide with the exógena suffixes, so the adapter
               can drop `.first()` and let any real collision fail loudly. -->
          <div id="vistaPrueba:frmPrueba:aniosFEPanelContentDiv">
            <input
              type="image"
              id="vistaPrueba:frmPrueba:btnBuscarFE"
              src="/img/aceptar.png"
              alt="Buscar facturas"
            />
            <select id="vistaPrueba:frmPrueba:anioSelFE">
              <option value="">Seleccione</option>
            </select>
          </div>

          <div id="vistaPrueba:frmPrueba:aniosPanelContentDiv" class="oculto">
            <p>CONDICIONES ACEPTACION INFORMACION REPORTADA POR TERCEROS</p>
            <input
              type="image"
              id="vistaPrueba:frmPrueba:btnBuscar"
              src="/img/aceptar.png"
              alt="Aceptar condiciones"
            />

            <select id="vistaPrueba:frmPrueba:anioSel" class="oculto">
              <option value="">Seleccione</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
            </select>

            <input
              type="image"
              id="vistaPrueba:frmPrueba:btnExogenaGenerar"
              class="oculto"
              src="/img/generar.png"
              alt="Generar"
            />
          </div>
        </td>
      </tr>
    </table>

    <script>
      const RETARDO_MS = __RETARDO__;
      const id = (valor) => document.getElementById(valor);
      const panel = id('vistaPrueba:frmPrueba:aniosPanelContentDiv');
      const anioSel = id('vistaPrueba:frmPrueba:anioSel');
      const generar = id('vistaPrueba:frmPrueba:btnExogenaGenerar');

      // The modal opens over AJAX. Clicking its buttons before it lands is what
      // broke production, so this delay is the whole point of the fixture.
      id('enlaceExogena').addEventListener('click', (evento) => {
        evento.preventDefault();
        setTimeout(() => panel.classList.remove('oculto'), RETARDO_MS);
      });

      // Accepting the terms is pure client-side jQuery on the real portal:
      // consReporteExogena() just shows the selection panel, no round trip.
      id('vistaPrueba:frmPrueba:btnBuscar').addEventListener('click', (evento) => {
        evento.preventDefault();
        [anioSel, generar].forEach((el) => el.classList.remove('oculto'));
      });

      // The year is registered SERVER-side through a RichFaces postback. Until
      // that lands the report has no year, so generating early downloads
      // nothing at all — no error, no file.
      anioSel.addEventListener('change', () => {
        fetch('/WebDashboard/DefDashboard.faces', { method: 'POST', body: anioSel.value });
      });

      // Generating downloads the file by itself; there is no separate link to
      // click. The year travels in the session, never in this URL.
      generar.addEventListener('click', (evento) => {
        evento.preventDefault();
        window.location.href = '/descargar/exogena';
      });
    </script>
  </body>
</html>
